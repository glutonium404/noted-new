spring.application.name=noted-backend
server.port=8080

# ── Database ─────────────────────────────────────────────────────────
# Real SQLite database file instead of the old plain-JSON db.json. The
# file (and its parent dir) is created automatically on first run — no
# separate database server to install or start.
#
# The path is relative to the working directory the app is started
# from (mvn spring-boot:run -> backend/, the Docker image -> /app).
# Override with NOTED_DB_PATH if you want it somewhere else.
noted.db.path=${NOTED_DB_PATH:./db/noted.db}
spring.datasource.url=jdbc:sqlite:${noted.db.path}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Creates/updates tables automatically from the @Entity classes below —
# fine for a demo project. For a real production app you'd switch to
# migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SQLite locks the whole file on write, so more than one open connection
# just causes "database is locked" errors under concurrent requests.
# Capping the pool at 1 avoids that (fine at this app's scale).
spring.datasource.hikari.maximum-pool-size=1

gemini.api.key=${GEMINI_API_KEY:}
